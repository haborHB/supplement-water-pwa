<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f766e">
    <meta name="description" content="本地记录每日补剂和饮水量的手机应用">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <title>补剂与饮水</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <p class="app-kicker">LOCAL HEALTH LOG</p>
          <h1>补剂与饮水</h1>
        </div>
        <button class="icon-button" id="install-button" type="button" title="安装到手机主屏幕" aria-label="安装到手机主屏幕" hidden>↓</button>
      </header>

      <div class="update-notice" id="app-update-notice" role="status" hidden>
        <span>新版本已就绪，刷新后生效。</span>
        <button class="small-button" id="reload-app-button" type="button">刷新</button>
      </div>

      <main id="view-root" class="view-root" aria-live="polite"></main>

      <nav class="bottom-nav" aria-label="主导航">
        <button class="nav-item is-active" type="button" data-view="today">
          <span class="nav-symbol">●</span>
          <span>今日</span>
        </button>
        <button class="nav-item" type="button" data-view="supplements">
          <span class="nav-symbol">＋</span>
          <span>补剂</span>
        </button>
        <button class="nav-item" type="button" data-view="history">
          <span class="nav-symbol">▤</span>
          <span>历史</span>
        </button>
        <button class="nav-item" type="button" data-view="settings">
          <span class="nav-symbol">⚙</span>
          <span>设置</span>
        </button>
      </nav>
    </div>

    <div class="modal-backdrop is-hidden" id="supplement-modal" role="presentation">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header">
          <div>
            <p class="eyebrow">SUPPLEMENT PROFILE</p>
            <h2 id="modal-title">新增补剂</h2>
          </div>
          <button class="icon-button secondary" id="close-modal-button" type="button" title="关闭" aria-label="关闭">×</button>
        </div>
        <form id="supplement-form">
          <input id="supplement-id" name="supplementId" type="hidden">
          <label>
            补剂名称
            <input id="supplement-name" name="name" type="text" placeholder="例如：维生素 D3" required>
          </label>
          <div class="form-grid">
            <label>
              品牌
              <input id="supplement-brand" name="brand" type="text" placeholder="可选">
            </label>
            <label>
              剂型
              <input id="supplement-type" name="form" type="text" placeholder="片剂、胶囊、粉剂">
            </label>
          </div>
          <div class="form-grid">
            <label>
              服用单位
              <input id="supplement-unit-label" name="unitLabel" type="text" value="片" required>
            </label>
            <label>
              每日计划数量
              <input id="supplement-daily-target" name="dailyTargetUnits" type="number" min="0" step="0.5" value="1" required>
            </label>
          </div>
          <label>
            建议时间
            <input id="supplement-timing" name="timing" type="text" placeholder="例如：早餐后">
          </label>
          <div class="section-heading">
            <div>
              <p class="eyebrow">ACTIVE INGREDIENTS</p>
              <h3>每单位含量</h3>
            </div>
            <button class="small-button" id="add-ingredient-button" type="button">＋ 添加成分</button>
          </div>
          <div class="parser-box">
            <label for="ingredient-raw-text">
              粘贴含量文本
              <textarea id="ingredient-raw-text" rows="4" placeholder="例如：维生素 C 500 mg；锌 10 mg&#10;也可以每行写一个成分"></textarea>
            </label>
            <div class="parser-actions">
              <button class="small-button" id="parse-ingredient-button" type="button">自动识别并填入</button>
              <span class="muted">支持 mg、g、μg、IU 及中文单位</span>
            </div>
          </div>
          <div id="ingredient-list" class="ingredient-list"></div>
          <label>
            标签或使用备注
            <textarea id="supplement-notes" name="notes" rows="3" placeholder="把标签上的其他信息、来源或注意事项记录在这里"></textarea>
          </label>
          <div class="modal-actions">
            <button class="text-button" id="cancel-modal-button" type="button">取消</button>
            <button class="primary-button" type="submit">保存档案</button>
          </div>
          <p id="supplement-save-error" class="form-error" role="alert" hidden></p>
        </form>
      </section>
    </div>

    <div class="toast is-hidden" id="toast" role="status"></div>
    <script src="./app.js"></script>
  </body>
</html>
